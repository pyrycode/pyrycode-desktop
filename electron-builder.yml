# electron-builder configuration — the unsigned Windows installer (#1416).
#
# A YAML file rather than a `build` block in package.json: every non-default key below needs a
# comment to explain itself, and JSON has none.
#
# Windows-only on purpose. There is no `mac` and no `linux` key, and adding one is a ticket of its
# own rather than a line here: only the Windows target has ever been installed and launched, so an
# artifact for another platform would ship having never been run.
appId: dev.pyrycode.desktop
productName: Pyrycode Desktop

# NOT redundant with `productName` above. `app.getPath('userData')` follows Electron's
# `app.getName()`, which reads `productName` then `name` out of the APP's package.json — this
# config file is invisible to it. Injecting the name into the PACKAGED package.json is what puts
# the secure-store blobs, the saved hosts and the rotating diagnostic log under
# `%APPDATA%\Pyrycode Desktop`, where a later incident is told to look for them. Adding
# `productName` to the repo's package.json would reach the same result and also rename the data
# directory `npm run dev` uses, moving the author's live pairing out from under his daily driver.
extraMetadata:
  productName: Pyrycode Desktop

# An allowlist, not the default `**/*`: only the electron-vite output is app payload. It keeps
# `src/` and `e2e/` out of the asar, and with them the fake daemon, the fake relay and the test
# fixtures. Production `node_modules` still ship — electron-builder resolves those from the
# `dependencies` block rather than from this glob, which is what `externalizeDepsPlugin` in
# electron.vite.config.ts requires, since it leaves every runtime dependency unbundled.
files:
  - out/**
  - package.json

win:
  # The arch list is spelled out because the default is the BUILD HOST's, which is the one silent
  # way this config could hand the Surface an installer it cannot run: `electron-builder --win` on
  # an Apple Silicon Mac defaults to Windows-on-ARM, and an x64 Surface refuses it. Naming both
  # makes the single NSIS installer native on either Surface generation and independent of which
  # machine produced it. Drop `arm64` if the combined installer is ever a problem; it only costs
  # the ARM Surface x64 emulation.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # Both icons resolve from this one file: `nsis.installerIcon` falls back to the application icon
  # when `build/installerIcon.ico` is absent, and it is.
  icon: build/icon.ico

# No auto-update feed. Updating means running a newer installer over the old one.
publish: null
# `build/` is electron-builder's default buildResources directory, and it is a build input rather
# than app payload — which is why it does not appear in `files` above. It holds `icon.ico`, the
# raster the Windows target consumes, and `icon.png`, the 512² master both were rendered from and
# the source electron-builder would fall back to if the .ico were ever removed. Both are the
# snowflake `src/renderer/src/theme/PyryMark.tsx` already ships, on a tile in the palette's
# `--color-primary-container` / `--color-on-primary-container` pair.
